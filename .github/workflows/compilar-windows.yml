name: Compilar IFAM Office (Windows)

on:
  workflow_dispatch:
    inputs:
      lo_tag:
        description: 'Versão do LibreOffice usada como base'
        default: 'libreoffice-26.2.7.1'
        required: true

jobs:
  marca:
    name: Gerar imagens da marca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar tela de abertura, logotipos e janela Sobre
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito
          pip install -q fonttools cairosvg pillow
          python3 branding/fonte/gerar_marca.py branding
      - uses: actions/upload-artifact@v4
        with:
          name: marca
          path: |
            branding/*.png
            branding/*.svg
            branding/progress.conf

  pkgconf:
    name: Compilar pkgconf para Windows
    runs-on: windows-2022
    steps:
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Compilar pkgconf 2.4.3 (exigido pelo LibreOffice para o harfbuzz)
        shell: pwsh
        run: |
          python -m pip install --quiet meson ninja
          git clone --quiet --depth 1 --branch pkgconf-2.4.3 https://github.com/pkgconf/pkgconf C:\pkgconf-src
          meson setup C:\pkgconf-src\build C:\pkgconf-src --buildtype=release --default-library=static -Dtests=disabled
          meson compile -C C:\pkgconf-src\build
          New-Item -ItemType Directory -Force saida | Out-Null
          Copy-Item C:\pkgconf-src\build\pkgconf.exe saida\pkgconf-2.4.3.exe
          saida\pkgconf-2.4.3.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: pkgconf
          path: saida/pkgconf-2.4.3.exe

  windows:
    needs: [marca, pkgconf]
    runs-on: windows-2022
    timeout-minutes: 360          # limite máximo do GitHub (6 h)
    env:
      LO_TAG: ${{ github.event.inputs.lo_tag }}
      CHERE_INVOKING: 1           # mantém a pasta atual no shell do Cygwin
      SCCACHE_GHA_ENABLED: 'true' # guarda o que já foi compilado entre execuções
    steps:
      - name: Baixar este repositório
        uses: actions/checkout@v4

      # Trocar v1 ao mudar autogen.input, ferramentas ou patches do compilador.
      # Correcoes exclusivas do MSI nao invalidam o programa ja compilado.
      - name: Identificar ambiente do ponto de retomada
        id: ambiente
        shell: pwsh
        run: |
          if (-not $env:ImageVersion) { throw 'Versao da imagem Windows nao informada.' }
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Baixar as imagens da marca
        uses: actions/download-artifact@v4
        with:
          name: marca
          path: branding

      - name: Cache de compilação (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Instalar Cygwin
        uses: cygwin/cygwin-install-action@v6.1
        with:
          install-dir: C:\cygwin
          packages: >-
            autoconf automake bison cabextract flex gettext-devel git gperf make
            patch perl pkg-config python3 rsync unzip wget zip
            perl-Archive-Zip perl-Font-TTF perl-IO-String

      - name: Baixar o pkgconf compilado
        uses: actions/download-artifact@v4
        with:
          name: pkgconf
          path: C:\cygwin\opt\lo\bin

      - name: Restaurar downloads de execuções anteriores
        uses: actions/cache/restore@v4
        with:
          path: C:\lo\tarballs
          key: lo-downloads-${{ github.event.inputs.lo_tag }}-${{ github.run_id }}
          restore-keys: lo-downloads-${{ github.event.inputs.lo_tag }}-

      - name: Restaurar ponto de retomada dos binarios
        id: binarios
        uses: actions/cache/restore@v4
        with:
          path: C:\lo\core
          key: lo-build-windows-${{ github.event.inputs.lo_tag }}-v1-${{ steps.ambiente.outputs.image }}-${{ hashFiles('scripts/personalizar.py', 'branding/fonte/**') }}

      - name: Restaurar codigo-fonte e traducoes
        id: fontes
        if: steps.binarios.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: C:\lo\core
          key: lo-source-windows-${{ github.event.inputs.lo_tag }}-v1

      - name: Preparar codigo-fonte original quando ainda nao existe cache
        if: steps.binarios.outputs.cache-hit != 'true' && steps.fontes.outputs.cache-hit != 'true'
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: bash scripts/compilar.sh --preparar-fonte

      # Guarda somente os fontes originais, antes de personalizar ou compilar.
      # Assim workdir e instdir nao ocupam o cache de downloads das fontes.
      - name: Guardar codigo-fonte original e traducoes
        if: steps.binarios.outputs.cache-hit != 'true' && steps.fontes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\lo\core
          key: lo-source-windows-${{ github.event.inputs.lo_tag }}-v1

      - name: Compilar binarios aproveitando o sccache
        if: steps.binarios.outputs.cache-hit != 'true'
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          git config --global core.autocrlf false
          bash scripts/compilar.sh --compilar-binarios

      - name: Guardar build completo antes de gerar o MSI
        if: steps.binarios.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\lo\core
          key: lo-build-windows-${{ github.event.inputs.lo_tag }}-v1-${{ steps.ambiente.outputs.image }}-${{ hashFiles('scripts/personalizar.py', 'branding/fonte/**') }}

      - name: Gerar MSI a partir dos binarios prontos
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: bash scripts/compilar.sh --gerar-instalador

      - name: Guardar downloads para a próxima execução
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\lo\tarballs
          key: lo-downloads-${{ github.event.inputs.lo_tag }}-${{ github.run_id }}

      - name: Publicar o instalador .msi
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IFAM-Office-instalador
          path: |
            saida/*.msi
            saida/*.diff
          if-no-files-found: error

      - name: Guardar registros em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-de-erro
          path: |
            C:\lo\core\config.log
            C:\lo\core\autogen.input
            C:\lo\core\workdir\CustomTarget\instsetoo_native\install\*.log
          if-no-files-found: ignore
